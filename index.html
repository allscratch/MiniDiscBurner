      content="MiniDiscBurner - transférez votre musique vers un enregistreur MiniDisc NetMD ou HiMD depuis un navigateur ou une application desktop."

  <body>
    <script>
    try {
      if (location.protocol === 'http:' && !location.host.match(/^localhost/gm)) {
        // Make sure we're on https/file, or WebUSB won't work.
        location.replace(`https:${location.href.substring(location.protocol.length)}`);
        console.log('Redirecting to https....');
      }
    } catch (err) {
      console.log(err)
    }
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
  </body>
